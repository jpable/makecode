<header class="wrap">

  <div class="wrap fixed-top">
    <div class="mode-switch">
      <fieldset>
        <legend>表示モード</legend>
        <div class="options">
          <input type="radio" name="mode" id="mode-easy" value="easy">
          <label for="mode-easy">小3までの漢字</label>
          <input type="radio" name="mode" id="mode-normal" value="normal">
          <label for="mode-normal">全学年の漢字</label>
        </div>
      </fieldset>
    </div>
  </div>

  <div class="brand">
    <div>
      <h1 id="page-title"></h1>
      <p class="lead" id="page-lead"></p>
    </div>
  </div>

</header>
